name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check links between docs
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: only links inside the repo, so the check never fails on someone else's site.
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # The same command agents and people run locally (D0004).
      - run: bun run check

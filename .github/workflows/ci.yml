name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # weekly: full-history secret scan and fresh advisories

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links between docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Offline: only links inside the repo, so the check never fails on someone else's site.
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_KIT_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/test_kit_test
      # `bun run check` ends with the demo app's check, whose database tests need this.
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/demo_app_test
    steps:
      # Started first and in the background: it boots while the rest installs.
      - name: Start Postgres
        run: >
          docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci
          postgres:16 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do docker exec pg pg_isready -U ci >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs pg; exit 1
      # The same command agents and people run locally (D0004).
      - run: bun run check
      - name: Known vulnerabilities in dependencies
        run: bun audit --audit-level=high

  # The app made from presets/bun-ts-postgres, on its own: its full check against Postgres,
  # then it boots (migrations, server, /healthz). Kept under 5 minutes (research plan, M5).
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/demo_app_test
    steps:
      # Started first and in the background: it boots while the rest installs.
      - name: Start Postgres
        run: >
          docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=demo_app
          postgres:16 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do docker exec pg pg_isready -U ci >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs pg; exit 1
      - name: Demo app check
        working-directory: examples/demo-app
        run: bun run check
      - name: Demo app boots
        working-directory: examples/demo-app
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/demo_app
          PORT: "3000"
        run: |
          bun run db:migrate
          bun src/cli.ts serve &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then echo; kill "$pid"; exit 0; fi
            sleep 1
          done
          kill "$pid"; exit 1

  # A fresh project made by `create`, outside this repo: it installs from its own lockfile
  # and vendored packages, and passes its own check against Postgres (D0018).
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/new_app_test
    steps:
      # Started first and in the background: it boots while the rest installs.
      - name: Start Postgres
        run: >
          docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci
          postgres:16 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Create a project
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: bun packages/create/src/cli.ts create "$RUNNER_TEMP/new-app"
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do docker exec pg pg_isready -U ci >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs pg; exit 1
      # What the project's own CI runs; then nothing may be left uncommitted.
      - name: The project's own check
        working-directory: ${{ runner.temp }}/new-app
        run: |
          bun install --frozen-lockfile
          bun run check
          test -z "$(git status --porcelain)"
          bun "$GITHUB_WORKSPACE/packages/create/src/cli.ts" sync

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (MIT binary, checksum pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz
      - name: Self-test (a generated key must be caught)
        run: |
          d="$(mktemp -d)"
          key="AKIA$(LC_ALL=C tr -dc 'A-Z2-7' </dev/urandom | head -c16)"
          printf 'aws_access_key_id = %s\n' "$key" > "$d/creds.txt"
          set +e
          gitleaks dir --no-banner --redact "$d"
          rc=$?
          set -e
          rm -rf "$d"
          if [ "$rc" -ne 1 ]; then echo "::error::gitleaks did not catch the planted key (rc=$rc)"; exit 1; fi
      - name: Scan (the PR's commits; full history on main and weekly)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            gitleaks git --config .gitleaks.toml --redact --verbose .
          fi

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows (unpinned actions, injection, permissions)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
